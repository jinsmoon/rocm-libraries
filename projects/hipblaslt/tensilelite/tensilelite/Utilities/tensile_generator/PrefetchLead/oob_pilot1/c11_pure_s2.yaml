# Prefetch lead experiment, kernel c11_pure_s2: category_11/pure_padded solution 2.
# StinkyTofuParameters: REF {PrefetchLeadCycles: 0} = constant lead 30 (develop); EXP {} = the lead from the prefetch chunks.
# Order REF, EXP (c11_pure_s2_rev.yaml has EXP, REF).
GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  KernelTime: false
  BoundsCheck: 0
  PrintSolutionRejectionReason: true
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  PruneSparseMode: 0
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 100
  EnqueuesPerSync: 1000
  PrintWinnersOnly: false
  Architecture: gfx1250
  KeepBuildTmp: true
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 384
  NumBenchmarks: 5
  CSVMergeSameProblemID: false
BenchmarkProblems:
- - OperationType: GEMM
    Batched: true
    ComputeDataType: 0
    DataType: 7
    DestDataType: 7
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBias: 0
  - InitialSolutionParameters: null
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ActivationFuncCall: [false]
    - AssertFree0ElementMultiple: [8]
    - ClusterLocalRead: [0]
    - DepthU: [128]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [1]
    - GlobalReadVectorWidthB: [1]
    - HalfPLR: [1]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadA: [1024]
    - LdsBlockSizePerPadB: [256]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [8]
    - LdsPadB: [8]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [8]
    - LocalReadVectorWidthB: [8]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PostLoopStoreInNll: [false]
    - PrefetchGL2: [2]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - SourceSwap: [true]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - StoreVectorWidth: [4]
    - SuppressNoLoadLoop: [true]
    - TDMInst: [3]
    - ThreadTile:
      - [1, 1]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - UseSgprForGRO: [0]
    - VectorWidthA: [4]
    - VectorWidthB: [1]
    - WavefrontSize: [32]
    - Groups:
      - - MatrixInstruction: [16, 16, 32, 1, 1, 12, 7, 2, 2]
          WorkGroup: [32, 4, 1]
          MIArchVgpr: true
    - StinkyTofuParameters:
      - PrefetchLeadCycles: 0
      - {}
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [4144, 40208, 1, 24656, 4224, 4224, 24704, 24704]
    - BiasTypeArgs: [0, 7]
