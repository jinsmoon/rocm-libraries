# Prefetch lead experiment, kernel c13_s4: category_13 solution 4.
# StinkyTofuParameters: REF {PrefetchLeadCycles: 0} = constant lead 30 (develop); EXP {} = the lead from the prefetch chunks.
# Order REF, EXP (c13_s4_rev.yaml has EXP, REF).
GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  KernelTime: false
  BoundsCheck: 0
  PrintSolutionRejectionReason: true
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  PruneSparseMode: 0
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 100
  EnqueuesPerSync: 1000
  PrintWinnersOnly: false
  Architecture: gfx1250
  KeepBuildTmp: true
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 384
  NumBenchmarks: 5
  CSVMergeSameProblemID: false
BenchmarkProblems:
- - OperationType: GEMM
    Activation: true
    ActivationType: hipblaslt_all
    Batched: true
    ComputeDataType: 0
    DataType: 7
    DestDataType: 7
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBias: 1
    UseScaleAlphaVec: 1
  - InitialSolutionParameters: null
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ClusterDim:
      - [4, 4]
    - ClusterLocalRead: [0]
    - DepthU: [128]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [1]
    - GlobalReadVectorWidthB: [1]
    - GlobalSplitUWorkGroupMappingRoundRobin: [true]
    - HalfPLR: [1]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadA: [512]
    - LdsBlockSizePerPadB: [1024]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [8]
    - LdsPadB: [8]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [8]
    - LocalReadVectorWidthB: [8]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PrefetchGL2: [2]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - SourceSwap: [true]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - StoreVectorWidth: [2]
    - SuppressNoLoadLoop: [true]
    - TDMInst: [3]
    - ThreadTile:
      - [1, 1]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - UseSgprForGRO: [0]
    - VectorWidthA: [2]
    - VectorWidthB: [4]
    - WavefrontSize: [32]
    - WorkGroupMapping: [1]
    - PostLoopStoreInNll: [false]
    - Groups:
      - - MatrixInstruction: [16, 16, 32, 1, 1, 10, 8, 2, 2]
          WorkGroup: [32, 4, 1]
          MIArchVgpr: true
    - StinkyTofuParameters:
      - PrefetchLeadCycles: 0
      - {}
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [13120, 13264, 1, 14880, 13120, 13120, 14976, 14976]
    - BiasTypeArgs: [0, 7]
