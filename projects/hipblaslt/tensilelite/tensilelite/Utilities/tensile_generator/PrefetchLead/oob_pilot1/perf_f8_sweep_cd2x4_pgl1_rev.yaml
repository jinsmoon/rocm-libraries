# Prefetch lead experiment, kernel perf_f8_sweep_cd2x4_pgl1: perf_yamls/gfx1250/maf/tuning/f8_tn_maf_finetune_sweep.yaml, ClusterDim [2, 4], PrefetchGL2 1, other sweep knobs at their first value.
# StinkyTofuParameters: REF {PrefetchLeadCycles: 0} = constant lead 30 (develop); EXP {} = the lead from the prefetch chunks.
# Order EXP, REF.
BenchmarkProblems:
- - Activation: false
    Batched: true
    ComputeDataType: s
    DataType: F8
    DestDataType: F8
    HighPrecisionAccumulate: true
    OperationType: GEMM
    SupportUserArgs: true
    TransposeA: true
    TransposeB: false
    UseBeta: true
    UseBias: 0
  - BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [4096, 4096, 1, 65536]
      - Exact: [4096, 4096, 1, 131072]
    BenchmarkForkParameters: null
    BenchmarkJoinParameters: null
    ForkParameters:
    - UseSgprForGRO: [0]
    - ForceDisableShadowInit: [true]
    - MatrixInstruction:
      - [16, 16, 128, 1, 1, 8, 8, 2, 2]
    - DepthU: [256]
    - TDMInst: [3]
    - HalfPLR: [1]
    - TDMIterateMode: [-1]
    - TransposeLDS: [-1]
    - LdsPadA: [-1]
    - LdsPadB: [-1]
    - LdsBlockSizePerPadA: [-1]
    - LdsBlockSizePerPadB: [-1]
    - LdsPadMXSA: [-1]
    - LdsPadMXSB: [-1]
    - LdsBlockSizePerPadMXSA: [-1]
    - LdsBlockSizePerPadMXSB: [-1]
    - LDSTrInst: [false]
    - StaggerU: [0]
    - ScheduleIterAlg: [4]
    - PrefetchLocalRead: [1]
    - PrefetchGlobalRead: [2]
    - StoreRemapVectorWidth: [0]
    - GlobalSplitU: [1]
    - GlobalSplitUAlgorithm: [MultipleBuffer]
    - GlobalReadVectorWidthA: [-1]
    - GlobalReadVectorWidthB: [-1]
    - VectorWidthA: [-1]
    - VectorWidthB: [-1]
    - LDSSegmentInterleave: [1]
    - LDSSegmentBRotate: [0]
    - LocalReadVectorWidth: [-1]
    - 1LDSBuffer: [0]
    - SourceSwap: [true]
    - WorkGroupMapping: [1]
    - StoreVectorWidth: [-1]
    - NumElementsPerBatchStore: [16]
    - GroupLoadStore: [true]
    - InterleaveAlpha: [2]
    - WavefrontSize: [32]
    - ExpandPointerSwap: [false]
    - CompactLoopStore: [false]
    - PreloadKernArgs: [true]
    - InitCIterWmma: [0]
    - SwInstructionPrefetch: [0]
    - ClusterDim:
      - [2, 4]
    - ClusterAIDMapping: [-1]
    - PrefetchGL2: [1]
    - StinkyTofuParameters:
      - {}
      - PrefetchLeadCycles: 0
    InitialSolutionParameters: null
    JoinParameters: null
GlobalParameters:
  Architecture: gfx1250
  BoundsCheck: 0
  DataInitTypeA: 12
  DataInitTypeAlpha: 1
  DataInitTypeB: 13
  DataInitTypeBeta: 0
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  EnqueuesPerSync: 1000
  KeepBuildTmp: true
  KernelTime: false
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  NumWarmups: 100
  PrintLevel: 2
  PrintSolutionRejectionReason: true
  PrintWinnersOnly: false
  PruneSparseMode: 0
  RotatingBufferSize: 256
  SyncsPerBenchmark: 1
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  NumBenchmarks: 5
  SkipSlowSolutionRatio: 0.0
  CSVMergeSameProblemID: false
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010,
    skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]
